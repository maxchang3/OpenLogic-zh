name: Notify boxes-and-diamonds-zh

on:
  push:
    branches: [main]

jobs:
  dispatch:
    name: Dispatch build to B&D
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch repository_dispatch to boxes-and-diamonds-zh
        env:
          BD_TOKEN: ${{ secrets.BD_DISPATCH_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $BD_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/maxchang3/boxes-and-diamonds-zh/dispatches \
            -d '{"event_type": "olp-updated"}'
