name: Notify assembly repositories

on:
  push:
    branches: [main]

jobs:
  dispatch:
    name: Dispatch affected assembly builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out history for the diff
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect changed files
        id: changed
        run: |
          before='${{ github.event.before }}'
          after='${{ github.sha }}'
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            # 首次推送或历史不可比时无法判断影响面，按共享层改动全量派发。
            echo 'all=true' >> "$GITHUB_OUTPUT"
            : > .dispatch-changed
          else
            echo 'all=false' >> "$GITHUB_OUTPUT"
            git diff --name-only "$before" "$after" > .dispatch-changed
          fi
          echo '--- changed files ---'
          cat .dispatch-changed

      - name: Plan dispatch
        id: plan
        run: |
          set -- --changed .dispatch-changed \
            --bd-closure locale/zh/consumers/boxes-and-diamonds-zh.txt \
            --slc-closure locale/zh/consumers/sets-logic-computation-zh.txt \
            --github-output "$GITHUB_OUTPUT"
          if [ "${{ steps.changed.outputs.all }}" = 'true' ]; then
            set -- "$@" --all
          fi
          python3 .github/scripts/plan-dispatch.py "$@"

      - name: Dispatch to boxes-and-diamonds-zh
        if: steps.plan.outputs.bd == 'true'
        env:
          DISPATCH_TOKEN: ${{ secrets.BD_DISPATCH_TOKEN }}
        run: |
          # -f 让 HTTP 错误直接失败，避免静默漏派发。
          curl -fsS -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/maxchang3/boxes-and-diamonds-zh/dispatches \
            -d '{"event_type": "olp-updated"}'

      - name: Dispatch to sets-logic-computation-zh
        if: steps.plan.outputs.slc == 'true'
        env:
          DISPATCH_TOKEN: ${{ secrets.BD_DISPATCH_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/maxchang3/sets-logic-computation-zh/dispatches \
            -d '{"event_type": "olp-updated"}'
